name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: planner_scraper/requirements.txt
      - run: pip install -r planner_scraper/requirements.txt
      - name: Parser and validator tests
        run: python -m pytest planner_scraper/tests -q
      - name: Validate sample data
        run: python -m planner_scraper.validate data/planner-sample
      - name: Validate published data
        run: |
          if [ -f data/planner/meta.json ]; then python -m planner_scraper.validate data/planner; fi

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine tests
        run: node --test "js/tests/*.test.js"
